name: travely

services:
  postgres:
    image: postgres:16
    container_name: travely-postgres
    environment:
      POSTGRES_USER: travely
      POSTGRES_PASSWORD: travely
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  rabbitmq:
    image: rabbitmq:4-management
    container_name: travely-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: travely
      RABBITMQ_DEFAULT_PASS: travely
    ports:
      - "5672:5672"     # aici se conectează serviciile
      - "15672:15672"   # interfața web RabbitMQ

  mailpit:
    image: axllent/mailpit
    container_name: travely-mailpit
    ports:
      - "1025:1025"     # aici trimite aplicația emailurile
      - "8025:8025"     # aici le vezi în browser

volumes:
  postgres-data: